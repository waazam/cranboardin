name: Deploy to wazam.org

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GAME_SLUG: cranboardin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mkdir -p ~/godot-bin
          unzip -q godot.zip -d ~/godot-bin
          curl -sSL -o templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export web build
        # The html is exported under a per-commit basename: Godot derives
        # every asset name (.wasm, .pck, worklets, icons) from it, so each
        # deploy ships brand-new file names and no browser can ever reuse a
        # stale cached build. The html itself is renamed back to index.html
        # -- it is tiny and revalidates via ETag on every load.
        run: |
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          STAMP=game-${GITHUB_SHA::8}
          mkdir -p build/web
          $GODOT --headless --import || true
          $GODOT --headless --export-release "Web" build/web/${STAMP}.html
          test -f build/web/${STAMP}.wasm
          mv build/web/${STAMP}.html build/web/index.html

      - name: Upload to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            build/web/ deploy@143.198.112.198:/var/www/site/games/${GAME_SLUG}/